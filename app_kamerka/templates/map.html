<script type="text/javascript">
function initialize() {
    var centerLat = 0, centerLon = 0;
    {% for device in devices %}
    {% if forloop.first %}
    centerLat = {{ device.safe_lat }};
    centerLon = {{ device.safe_lon }};
    {% endif %}
    {% endfor %}

    var map = L.map('leaflet_world_map', {
        minZoom: 1,
        maxZoom: 17
    }).setView([centerLat, centerLon], 3);

    // Apply saved theme (or default cyberpunk)
    var themeRef = { layer: null, currentKey: KamerkaTiles.savedTheme() };
    themeRef.layer = KamerkaTiles.apply(themeRef.currentKey, map);

    // Build device point list for markers + heat map
    var markers = [];
    var heatPoints = [];   // [lat, lon, intensity]
    {% for device in devices %}
    (function() {
        var vulns = "{{ device.vulns|default:''|escapejs }}";
        var intensity = Math.min(1.0, 0.2 + (vulns.match(/CVE-/g)||[]).length * 0.15);
        heatPoints.push([{{device.safe_lat}}, {{device.safe_lon}}, intensity]);
        var m = L.marker([{{device.safe_lat}}, {{device.safe_lon}}]).addTo(map);
        m.bindPopup('<a href="/results/{{device.search_id}}/{{device.id}}/{{device.ip|escapejs}}">{{device.type|escapejs}} — {{device.ip|escapejs}}</a>');
        markers.push(m);
    })();
    {% endfor %}

    // Heat map layer (hidden by default, toggle via button)
    var heatLayer = L.heatLayer(heatPoints, {
        radius: 28, blur: 22, maxZoom: 10,
        gradient: { 0.1: '#0064d7', 0.4: '#00e1ff', 0.65: '#ff00cd', 1.0: '#ff0000' }
    });
    var heatVisible = false;

    if (markers.length > 1) {
        var group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.1));
    }

    // Inject theme picker + heat map toggle
    KamerkaTiles.injectPicker(map, themeRef, '.panel-heading');

    var mapEl = document.getElementById('leaflet_world_map');
    var heatBtn = document.createElement('button');
    heatBtn.textContent = '🌡 HEAT MAP';
    heatBtn.title = 'Toggle 2-D heat map (severity by CVE count)';
    heatBtn.style.cssText = 'position:absolute;top:8px;left:60px;z-index:1000;' +
        'background:rgba(10,13,18,0.88);border:1px solid #0064d7;color:#00e1ff;' +
        'font-family:var(--cp-font,monospace);font-size:0.95em;letter-spacing:0.06em;' +
        'padding:4px 8px;cursor:pointer;';
    heatBtn.addEventListener('click', function () {
        heatVisible = !heatVisible;
        if (heatVisible) {
            heatLayer.addTo(map);
            heatBtn.style.color = '#ff00cd';
            heatBtn.style.borderColor = '#ff00cd';
        } else {
            map.removeLayer(heatLayer);
            heatBtn.style.color = '#00e1ff';
            heatBtn.style.borderColor = '#0064d7';
        }
    });
    mapEl.appendChild(heatBtn);

    // ── WorldMonitor-style data layer control panel ──────────────────────
    // Fetch available layers from the API and add toggle buttons.
    var _layerGeoJsonLayers = {};
    var _layerConfigs = {};
    var _layerButtons = {};

    function _layerStyle(color) {
        return {
            color: color || '#00e1ff',
            fillColor: color || '#00e1ff',
            weight: 2,
            opacity: 0.85,
            fillOpacity: 0.6,
            radius: 6
        };
    }

    function _pointToLayer(feature, latlng) {
        var color = (feature.properties && feature.properties._layer_color) || '#00e1ff';
        return L.circleMarker(latlng, _layerStyle(color));
    }

    function _escapeHtml(value) {
        var node = document.createElement('div');
        node.textContent = value;
        return node.innerHTML;
    }

    function _onEachFeature(feature, layer) {
        if (!feature.properties) return;
        var props = feature.properties;
        var html = '<div style="font-family:monospace;font-size:0.82em;">';
        Object.keys(props).forEach(function(k) {
            if (k.startsWith('_')) return;
            var val = props[k];
            if (val === null || val === undefined || val === '') return;
            if (typeof val === 'object') val = JSON.stringify(val);
            html += '<b>' + _escapeHtml(k) + ':</b> ' +
                _escapeHtml(String(val).substring(0, 120)) + '<br>';
        });
        html += '</div>';
        layer.bindPopup(html);
    }

    function _layerBboxQuery() {
        var bounds = map.getBounds();
        if (!bounds) return '';
        var sw = bounds.getSouthWest();
        var ne = bounds.getNorthEast();
        return '?bbox=' + [
            sw.lng.toFixed(6),
            sw.lat.toFixed(6),
            ne.lng.toFixed(6),
            ne.lat.toFixed(6)
        ].join(',');
    }

    function _layerFeaturesUrl(layerCfg) {
        if (layerCfg && layerCfg.endpoints && layerCfg.endpoints.features) {
            return layerCfg.endpoints.features;
        }
        return '/api/layers/' + layerCfg.slug + '/features.json';
    }

    function _loadLayer(slug, color, btn) {
        var cfg = _layerConfigs[slug];
        if (!cfg) return;
        fetch(_layerFeaturesUrl(cfg) + _layerBboxQuery())
            .then(function(r) { return r.json(); })
            .then(function(fc) {
                if (_layerGeoJsonLayers[slug]) {
                    map.removeLayer(_layerGeoJsonLayers[slug]);
                    delete _layerGeoJsonLayers[slug];
                }
                // Tag each feature with its layer color for styling
                (fc.features || []).forEach(function(f) {
                    f.properties = f.properties || {};
                    f.properties._layer_color = color;
                });
                var glayer = L.geoJSON(fc, {
                    pointToLayer: _pointToLayer,
                    onEachFeature: _onEachFeature,
                    style: function(f) {
                        return { color: color, weight: 2, opacity: 0.8 };
                    }
                }).addTo(map);
                _layerGeoJsonLayers[slug] = glayer;
                if (btn) {
                    btn.style.color = color;
                    btn.style.borderColor = color;
                }
            })
            .catch(function(e) { console.warn('layer fetch error', slug, e); });
    }

    function _toggleLayer(slug, color, btn) {
        if (_layerGeoJsonLayers[slug]) {
            map.removeLayer(_layerGeoJsonLayers[slug]);
            delete _layerGeoJsonLayers[slug];
            btn.style.color = '#00e1ff';
            btn.style.borderColor = '#0064d7';
            return;
        }
        _loadLayer(slug, color, btn);
    }

    function _refreshVisibleLayers() {
        Object.keys(_layerGeoJsonLayers).forEach(function(slug) {
            var cfg = _layerConfigs[slug];
            if (!cfg) return;
            _loadLayer(slug, cfg.color, _layerButtons[slug]);
        });
    }

    function _initLiveLayerUpdates() {
        if (!window.EventSource) return;
        var events = new EventSource('/api/feeds/entries/sse/');
        events.addEventListener('layer_updated', function(ev) {
            try {
                var payload = JSON.parse(ev.data || '{}');
                if (!payload.slug || !_layerGeoJsonLayers[payload.slug]) return;
                var cfg = _layerConfigs[payload.slug];
                if (!cfg) return;
                _loadLayer(payload.slug, cfg.color, _layerButtons[payload.slug]);
            } catch (e) {
                console.warn('layer_updated parse error', e);
            }
        });
        events.addEventListener('error', function() {
            console.warn('layer live updates unavailable; retrying');
        });
    }

    // Build the layer control panel
    var layerPanel = document.createElement('div');
    layerPanel.id = 'layer-control-panel';
    layerPanel.style.cssText = 'position:absolute;top:45px;left:8px;z-index:1000;' +
        'background:rgba(10,13,18,0.88);border:1px solid var(--cp-border,#0064d7);' +
        'padding:6px 10px;font-family:monospace;font-size:0.78em;color:#aaa;' +
        'max-width:180px;';
    layerPanel.innerHTML = '<div style="color:#ff00cd;letter-spacing:0.1em;margin-bottom:4px;">DATA LAYERS</div>';
    mapEl.appendChild(layerPanel);

    fetch('/api/layers/?view=map')
        .then(function(r) { return r.json(); })
        .then(function(layers) {
            layers.forEach(function(layer) {
                _layerConfigs[layer.slug] = layer;
                var btn = document.createElement('button');
                btn.textContent = (layer.icon || '●') + ' ' + layer.name;
                btn.title = 'Toggle ' + layer.name + ' layer';
                btn.style.cssText = 'display:block;width:100%;text-align:left;margin:2px 0;' +
                    'background:transparent;border:1px solid #0064d7;color:#00e1ff;' +
                    'font-family:monospace;font-size:0.9em;padding:2px 5px;cursor:pointer;';
                btn.addEventListener('click', function() {
                    _toggleLayer(layer.slug, layer.color, btn);
                });
                _layerButtons[layer.slug] = btn;
                layerPanel.appendChild(btn);
            });
            map.on('moveend', _refreshVisibleLayers);
            _initLiveLayerUpdates();
        })
        .catch(function() {
            layerPanel.innerHTML += '<span style="color:#666">unavailable</span>';
        });
}

document.addEventListener('DOMContentLoaded', function() {
    initialize();
});
</script>
